name: Build, test, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: link108/slopyard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: extractions/setup-just@v3

      - run: just typecheck

      - run: just lint

      - run: just test

      - run: just build

      - name: Compute short SHA
        if: github.event_name == 'push'
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open deploy PR against homelab
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PUSH_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.sha.outputs.short }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/link108/homelab.git" /tmp/homelab
          cd /tmp/homelab
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions (slopyard)"
          git checkout -b "deploy/slopyard-$SHORT_SHA"
          ./scripts/request-deploy.sh slopyard "$SHORT_SHA"
          git add -A
          git commit -m "deploy(slopyard): $SHORT_SHA"
          git push -u origin "deploy/slopyard-$SHORT_SHA"
          gh pr create --repo link108/homelab \
            --title "deploy(slopyard): $SHORT_SHA" \
            --body "Auto-deploy from slopyard GitHub Actions" \
            --head "deploy/slopyard-$SHORT_SHA"
